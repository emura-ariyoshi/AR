<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A-Frame を読み込む -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js を読み込む -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
  </head>
  <body style="margin: 0; overflow: hidden; background: transparent;">
    <style>
      html, body { 
        background: transparent; 
        width: 100%; 
        height: 100%;
      }
      canvas { 
        background: transparent; 
      }
    </style>
	  
    <!-- A-FrameにAR.jsを紐づけ、VRボタン非表示、深度バッファ追加 -->
    <a-scene embedded arjs="backgroundColor: transparent;" vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true; alpha: true;">
	    
      <!-- 3DCGモデルを読み込む -->
      <a-assets>
        <a-asset-item id="cake" src="./asset/cake.glb"></a-asset-item>
        <audio id="happyBirthdayAudio" src="./asset/HappyBirthday.wav"></audio>
      </a-assets>

      <!-- マーカーの.pattファイルを読み込む -->
      <a-marker type="pattern" url="./asset/ar.patt">
        <!-- 3Dモデルを呼び出す -->
        <a-entity gltf-model="#cake"></a-entity>

        <!-- 音楽を流します -->
        <a-entity sound="src: #happyBirthdayAudio; autoplay: true; loop: true;"></a-entity>
      </a-marker>

      <!-- カメラを追加 -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // フルスクリーン表示をリクエスト
      function requestFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(err => {
            console.log('フルスクリーンリクエスト失敗:', err);
          });
        }
      }

      // ページ読み込み後にフルスクリーンをリクエスト
      window.addEventListener('load', () => {
        setTimeout(requestFullscreen, 500);
      });

      // タッチイベント後にもフルスクリーンをリクエスト（ユーザーインタラクション後）
      document.addEventListener('touchstart', () => {
        requestFullscreen();
      }, { once: true });
    </script>
  </body>
</html>
