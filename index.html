<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A-Frame を読み込む -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js を読み込む -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
  </head>
  <body style="margin: 0; overflow: hidden; background: transparent;">
    <style>
      html, body { 
        background: transparent; 
        width: 100%; 
        height: 100%;
      }
      canvas { 
        background: transparent; 
      }
      #camera-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.35);
        color: white;
        font-size: 18px;
        font-family: sans-serif;
        z-index: 10;
        opacity: 1;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      #camera-overlay.hidden {
        opacity: 0;
      }
    </style>
    <div id="camera-overlay">カメラを許可してください</div>
	  
    <!-- A-FrameにAR.jsを紐づけ、VRボタン非表示、深度バッファ追加 -->
    <a-scene embedded arjs="backgroundColor: transparent;" loading-screen="enabled: false;" vr-mode-ui="enabled: false;" renderer="logarithmicDepthBuffer: true; alpha: true;">
	    
      <!-- 3DCGモデルを読み込む -->
      <a-assets>
        <a-asset-item id="cake" src="./asset/cake.glb"></a-asset-item>
        <audio id="happyBirthdayAudio" src="./asset/HappyBirthday.wav"></audio>
      </a-assets>

      <!-- マーカーの.pattファイルを読み込む -->
      <a-marker type="pattern" url="./asset/ar.patt">
        <!-- 3Dモデルを呼び出す -->
        <a-entity gltf-model="#cake"></a-entity>

        <!-- 音楽を流します -->
        <a-entity sound="src: #happyBirthdayAudio; autoplay: true; loop: true;"></a-entity>
      </a-marker>

      <!-- カメラを追加 -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('camera-overlay');

      function hideCameraOverlay() {
        if (overlay) {
          overlay.classList.add('hidden');
        }
      }

      // カメラが使えるようになったらすぐオーバーレイを消す
      navigator.mediaDevices?.getUserMedia?.({ video: true, audio: true })
        .then(stream => {
          hideCameraOverlay();
          stream.getTracks().forEach(track => track.stop());
        })
        .catch(() => {
          // カメラ許可待ちでもそのまま表示
          setTimeout(() => {
            hideCameraOverlay();
          }, 1500);
        });

      // AR.js が開始したらオーバーレイを消す
      window.addEventListener('arjs-video-loaded', () => {
        hideCameraOverlay();
      });
    </script>
  </body>
</html>
